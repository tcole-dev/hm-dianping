server:
  port: 8081
spring:
  application:
    name: hmdp
  profiles:
    active: ${SPRING_PROFILE:dev} # 默认 dev 环境，生产通过环境变量切换 prod
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:123456}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  mvc:
    throw-exception-if-no-handler-found: true # 404时抛出异常而非默认页面
  resources:
    add-mappings: false # 禁用静态资源映射（纯API项目）
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  config: classpath:logback-spring.xml # 日志配置由 logback 管理
hmdp:
  jwt:
    secret: ${JWT_SECRET:hmdp-secret-key-change-in-production}
    ttl: 86400000
    tokenName: token
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucketName: ${MINIO_BUCKET:hmdp}
cache:
  max-size: ${CACHE_L1_MAX_SIZE:1000}
  ttl: ${CACHE_L1_TTL:30}